title: QUDYMA talk
author: Carlos Payá
version: 1.2.0
quarto-required: ">=1.6.0"
contributes:
  formats:
    revealjs:
      theme: [default, qudyma.scss]
      css: [fonts/montserrat.css]
      template-partials:
        - title-slide.html
      revealjs-plugins:
        - plugin
      # Math: pandoc leaves the TeX source in <eq> elements (gladtex) and the plugin renders
      # it with the bundled KaTeX. No loader script and no hard-coded path, so math works
      # offline, in standalone builds and wherever quarto add puts the extension.
      html-math-method: gladtex
      width: 1600
      height: 900
      margin: 0
      min-scale: 0.2
      max-scale: 3.0
      center: false
      date-format: "D MMMM YYYY"
      transition: fade
      transition-speed: fast
      background-transition: fade
      controls: false
      progress: true
      slide-number: c
      show-slide-number: all
      hash: true
      fragment-in-url: true
      navigation-mode: linear
      preview-links: false
      auto-stretch: false
      menu:
        side: left
        numbers: true
        hideMissingTitles: true
        openButton: false
